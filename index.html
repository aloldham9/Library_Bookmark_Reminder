<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Book Due Reminder</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f4f4f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
        }
        h1 { font-size: 1.5rem; margin-bottom: 10px; color: #2c3e50; }
        p { color: #666; font-size: 0.95rem; margin-bottom: 25px; }
        .btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            text-decoration: none;
            display: inline-block;
            box-sizing: border-box;
        }
        .btn:active { background: #1d4ed8; }
    </style>
</head>
<body>

<div class="card">
    <h1>📚 Library Book Due</h1>
    <p>Tap below to add your 2-week library return reminder to your phone's calendar.</p>
    <button class="btn" onclick="addToCalendar()">Add to Calendar</button>
</div>

<script>
function addToCalendar() {
    // Set due date to 14 days from today automatically
    const dueDate = new Date();
    dueDate.setDate(dueDate.getDate() + 14);
    
    // Format date for iCalendar (YYYYMMDD)
    const year = dueDate.getFullYear();
    const month = String(dueDate.getMonth() + 1).padStart(2, '0');
    const day = String(dueDate.getDate()).padStart(2, '0');
    const dateStr = `${year}${month}${day}`;

    // Generate standard iCalendar (.ics) content locally
    const icsContent = 
`BEGIN:VCALENDAR
VERSION:2.0
PRODID:-//Library Bookmark//EN
BEGIN:VEVENT
SUMMARY:Library Books Due Back!
DESCRIPTION:Time to return your library books so you don't get fined.
DTSTART;VALUE=DATE:${dateStr}
DTEND;VALUE=DATE:${dateStr}
BEGIN:VALARM
TRIGGER:-P1D
DESCRIPTION:Reminder: Library books due tomorrow
ACTION:DISPLAY
END:VALARM
END:VEVENT
END:VCALENDAR`;

    // Create a local blob and trigger download so the phone's native calendar catches it
    const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'library-due-date.ics';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    window.URL.revokeObjectURL(url);
}
</script>

</body>
</html>
